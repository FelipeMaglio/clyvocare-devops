oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db
    shm_size: 1g
    environment:
      ORACLE_PASSWORD: Oracle@2026
      APP_USER: clyvocare
      APP_USER_PASSWORD: Clyvo@2026
      ORACLE_MEM: 750
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 15
      start_period: 240s
    networks:
      - app-network
    restart: unless-stopped