  <text x="555" y="706" text-anchor="middle" font-size="12" fill="#475569">compila e executa</text>
  <text x="555" y="724" text-anchor="middle" font-size="12" fill="#475569">os testes</text>
  <rect x="640" y="650" width="150" height="105" rx="8" fill="#fff" stroke="#B45309" stroke-width="1.3"/>
  <text x="715" y="685" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Docker Desktop</text>
  <text x="715" y="706" text-anchor="middle" font-size="12" fill="#475569">build e push</text>
  <text x="715" y="724" text-anchor="middle" font-size="12" fill="#475569">da imagem</text>

