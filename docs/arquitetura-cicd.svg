  <rect x="460" y="610" width="350" height="170" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="635" y="635" text-anchor="middle" font-size="14" font-weight="700" fill="#78350F">Agente self-hosted (pool Default)</text>
