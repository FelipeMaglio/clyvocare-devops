  <text x="1090" y="205" text-anchor="middle" font-size="13" fill="#0F172A">API ClyvoCare (Spring Boot :8080)</text>
  <text x="1090" y="226" text-anchor="middle" font-size="12" fill="#475569">Swagger UI + API REST</text>

  <rect x="920" y="350" width="340" height="90" rx="8" fill="#fff" stroke="#15803D" stroke-width="1.5"/>
  <text x="1090" y="383" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Azure Container Registry</text>
  <text x="1090" y="406" text-anchor="middle" font-size="12" fill="#475569">acrclyvocare563512 • imagem Docker</text>

  <rect x="920" y="590" width="340" height="100" rx="8" fill="#fff" stroke="#15803D" stroke-width="1.5"/>
  <text x="1090" y="622" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Azure Container Instance</text>
  <text x="1090" y="644" text-anchor="middle" font-size="13" fill="#0F172A">Oracle XE em container :1521</text>
  <text x="1090" y="665" text-anchor="middle" font-size="12" fill="#475569">serviço XEPDB1 • banco em nuvem</text>

