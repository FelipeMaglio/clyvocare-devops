  <text x="635" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#0F4C8A">Azure Pipelines (YAML)</text>

  <rect x="485" y="165" width="300" height="125" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.3"/>
  <text x="500" y="187" font-size="14" font-weight="700" fill="#0C4A6E">CI — dispara a cada commit na master</text>
  <text x="500" y="209" font-size="12" fill="#0F172A">• Gradle build + testes automáticos</text>
  <text x="500" y="227" font-size="12" fill="#0F172A">• Publica resultados dos testes</text>
  <text x="500" y="245" font-size="12" fill="#0F172A">• Publica o artefato drop</text>
  <text x="500" y="263" font-size="12" fill="#0F172A">• docker build + push da imagem (ACR)</text>

  <rect x="485" y="305" width="300" height="100" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.3"/>
  <text x="500" y="327" font-size="14" font-weight="700" fill="#14532D">CD — após novo artefato gerado</text>
  <text x="500" y="349" font-size="12" fill="#0F172A">• Recria o container da API no ACI</text>
  <text x="500" y="367" font-size="12" fill="#0F172A">• Imagem com a tag do build</text>
  <text x="500" y="385" font-size="12" fill="#0F172A">• Segredos vindos do variable group</text>

