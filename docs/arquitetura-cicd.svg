  <g font-size="12" fill="#0F172A">
    <text x="80" y="839">git push na branch master</text>
    <text x="365" y="839">CI dispara automaticamente</text>
    <text x="650" y="839">job enviado ao agente self-hosted</text>
    <text x="935" y="839">Gradle build + testes (Oracle)</text>
    <text x="1220" y="839">publica o artefato drop</text>
    <text x="80" y="869">docker build + push no ACR</text>
