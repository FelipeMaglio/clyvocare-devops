  <rect width="1500" height="900" fill="#F8FAFC"/>

  <text x="750" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">ClyvoCare — Arquitetura e fluxo CI/CD (Sprint 4)</text>
  <text x="750" y="64" text-anchor="middle" font-size="13" fill="#475569">Java Spring Boot • Oracle XE em container • Azure DevOps com agente self-hosted • Azure Container Registry • Azure Container Instance</text>

  <!-- ===== Persona: Desenvolvedor ===== -->
  <circle cx="105" cy="130" r="16" fill="#0F6CBD"/>
  <path d="M80,190 Q80,155 105,155 Q130,155 130,190 Z" fill="#0F6CBD"/>
  <text x="105" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Desenvolvedor</text>
  <path d="M105,213 L105,233" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <rect x="40" y="235" width="130" height="70" rx="8" fill="#fff" stroke="#64748B" stroke-width="1.5"/>
  <text x="105" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Git local</text>
  <text x="105" y="282" text-anchor="middle" font-size="12" fill="#475569">editor + git push</text>

  <rect x="40" y="360" width="130" height="60" rx="8" fill="#fff" stroke="#64748B" stroke-width="1.5"/>
  <text x="105" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">GitHub</text>
  <text x="105" y="405" text-anchor="middle" font-size="12" fill="#475569">espelho do código</text>
  <path d="M105,305 L105,358" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6,4" fill="none" marker-end="url(#ahd)"/>
  <text x="114" y="338" font-size="11" fill="#475569">git push origin</text>

  <!-- ===== Zona Azure DevOps ===== -->
