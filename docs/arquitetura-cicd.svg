  <text x="265" y="114" font-size="15" font-weight="700" fill="#0F4C8A">Azure DevOps — projeto "Sprint 4 – Azure DevOps" (Private)</text>

  <rect x="270" y="150" width="150" height="70" rx="8" fill="#fff" stroke="#0F6CBD" stroke-width="1.5"/>
  <text x="345" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Azure Repos</text>
  <text x="345" y="200" text-anchor="middle" font-size="12" fill="#475569">branch master</text>

  <rect x="270" y="250" width="150" height="70" rx="8" fill="#fff" stroke="#0F6CBD" stroke-width="1.5"/>
  <text x="345" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Azure Artifacts</text>
  <text x="345" y="300" text-anchor="middle" font-size="12" fill="#475569">artefato drop (.jar)</text>

  <rect x="270" y="350" width="150" height="70" rx="8" fill="#fff" stroke="#0F6CBD" stroke-width="1.5"/>
  <text x="345" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Variable Group</text>
  <text x="345" y="400" text-anchor="middle" font-size="12" fill="#475569">segredos protegidos</text>

  <rect x="270" y="450" width="150" height="70" rx="8" fill="#fff" stroke="#0F6CBD" stroke-width="1.5"/>
  <text x="345" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Service Connection</text>
