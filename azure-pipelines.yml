trigger:
  branches:
    include:
      - master

pool:
  name: Default

variables:
  - group: clyvocare-secrets
  - name: RG
    value: rg-clyvocare-s4
  - name: ACR
    value: acrclyvocare563512
  - name: IMAGE
    value: clyvocare-api
  - name: DB_HOST
    value: oracle-clyvocare563512.eastus.azurecontainer.io
  - name: DB_USER
    value: clyvocare

stages:
  - stage: CI
    displayName: Build e Testes
    jobs:
      - job: build
        steps:
          - script: gradlew.bat clean build
            displayName: Gradle build + testes
            env:
              SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//$(DB_HOST):1521/XEPDB1
              SPRING_DATASOURCE_USERNAME: $(DB_USER)
              SPRING_DATASOURCE_PASSWORD: $(DB_PASSWORD)
              DB_HOST: $(DB_HOST)
              DB_USER: $(DB_USER)
              DB_PASSWORD: $(DB_PASSWORD)
              JWT_SECRET: $(JWT_SECRET)
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/build/test-results/test/*.xml'
          - task: CopyFiles@2
            inputs:
              SourceFolder: build/libs
              Contents: '*.jar'
              TargetFolder: $(Build.ArtifactStagingDirectory)
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: drop
          - task: AzureCLI@2
            displayName: Docker build e push no ACR
            inputs:
              azureSubscription: sc-azure
              scriptType: ps
              scriptLocation: inlineScript
              failOnStandardError: false
              inlineScript: |
                az acr login -n $(ACR)
                docker build -t $(ACR).azurecr.io/$(IMAGE):$(Build.BuildId) .
                docker push $(ACR).azurecr.io/$(IMAGE):$(Build.BuildId)

  - stage: CD
    displayName: Deploy no ACI
    dependsOn: CI
    condition: succeeded()
    jobs:
      - deployment: deploy
        environment: producao
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: sc-azure
                    scriptType: ps
                    scriptLocation: inlineScript
                    failOnStandardError: false
                    inlineScript: |
                      az container delete -g $(RG) -n aci-clyvocare-api --yes
                      az container create -g $(RG) -n aci-clyvocare-api `
                        --location eastus `
                        --image $(ACR).azurecr.io/$(IMAGE):$(Build.BuildId) `
                        --os-type Linux --cpu 1 --memory 2 `
                        --ports 8080 --ip-address Public `
                        --dns-name-label clyvocare-api-563512 `
                        --secure-environment-variables DB_PASSWORD=$(DB_PASSWORD) SPRING_DATASOURCE_PASSWORD=$(DB_PASSWORD) JWT_SECRET=$(JWT_SECRET) `
                        --environment-variables DB_HOST=$(DB_HOST) DB_USER=$(DB_USER) SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//$(DB_HOST):1521/XEPDB1 SPRING_DATASOURCE_USERNAME=$(DB_USER)
