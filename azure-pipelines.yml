trigger:
  branches:
    include:
      - master

pool:
  name: Default

variables:
  - group: clyvocare-secrets
  - name: RG
    value: rg-clyvocare-s4
  - name: ACR
    value: acrclyvocare563512
  - name: IMAGE
    value: clyvocare-api
  - name: DB_HOST
    value: oracle-clyvocare563512.eastus.azurecontainer.io
  - name: DB_USER
    value: clyvocare

stages:
  - stage: CI
    displayName: Build e Testes
    jobs:
      - job: build
        steps:
          - script: gradlew.bat clean build
            displayName: Gradle build + testes
            env:
              SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//$(DB_HOST):1521/XEPDB1
              SPRING_DATASOURCE_USERNAME: $(DB_USER)
              SPRING_DATASOURCE_PASSWORD: $(DB_PASSWORD)
              DB_HOST: $(DB_HOST)
              DB_USER: $(DB_USER)
              DB_USERNAME: $(DB_USER)
              DB_PASSWORD: $(DB_PASSWORD)
              JWT_SECRET: $(JWT_SECRET)
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/build/test-results/test/*.xml'
          - task: CopyFiles@2
            inputs:
              SourceFolder: build/libs
              Contents: '*.jar'
              TargetFolder: $(Build.ArtifactStagingDirectory)
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: drop
          - task: AzureCLI@2
            displayName: Docker build e push no ACR
            inputs:
              azureSubscription: sc-azure
              scriptType: ps
              scriptLocation: inlineScript
              failOnStandardError: false
              inlineScript: |
                az acr login -n $(ACR)
                docker build -t $(ACR).azurecr.io/$(IMAGE):$(Build.BuildId) .
                docker push $(ACR).azurecr.io/$(IMAGE):$(Build.BuildId)

  - stage: CD
    displayName: Deploy no ACI
    dependsOn: CI
    condition: succeeded()
    jobs:
      - deployment: deploy
        environment: producao
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Deploy no ACI via YAML
                  inputs:
                    azureSubscription: sc-azure
                    scriptType: ps
                    scriptLocation: inlineScript
                    failOnStandardError: false
                    inlineScript: |
                      $yaml = @'
                      apiVersion: 2021-10-01
                      location: eastus
                      name: aci-clyvocare-api
                      type: Microsoft.ContainerInstance/containerGroups
                      properties:
                        osType: Linux
                        containers:
                        - name: clyvocare-api
                          properties:
                            image: $(ACR).azurecr.io/$(IMAGE):$(Build.BuildId)
                            ports:
                            - port: 8080
                            resources:
                              requests:
                                cpu: 1
                                memoryInGb: 2
                            environmentVariables:
                            - name: DB_HOST
                              value: $(DB_HOST)
                            - name: DB_USER
                              value: $(DB_USER)
                            - name: DB_USERNAME
                              value: $(DB_USER)
                            - name: SPRING_DATASOURCE_URL
                              value: jdbc:oracle:thin:@//$(DB_HOST):1521/XEPDB1
                            - name: SPRING_DATASOURCE_USERNAME
                              value: $(DB_USER)
                            - name: DB_PASSWORD
                              secureValue: $(DB_PASSWORD)
                            - name: SPRING_DATASOURCE_PASSWORD
                              secureValue: $(DB_PASSWORD)
                            - name: JWT_SECRET
                              secureValue: $(JWT_SECRET)
                        ipAddress:
                          type: Public
                          dnsNameLabel: clyvocare-api-563512
                          ports:
                          - protocol: tcp
                            port: 8080
                      '@
                      Set-Content -Path aci-api.yaml -Value $yaml -Encoding utf8
                      az container delete -g $(RG) -n aci-clyvocare-api --yes
                      az container create -g $(RG) --file aci-api.yaml
                      Remove-Item aci-api.yaml -Force
